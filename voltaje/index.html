<style>
/* Layout: una columna de juego estrecha, como la pantalla vertical de los vídeos; HUD arriba, tarjeta de pregunta, apuesta, respuestas. Paleta del canal (biblia). */
:root{
  --noche:#0E1430; --noche-2:#161E45; --noche-3:#222B5C;
  --crema:#F5EBDD; --crema-tenue:rgba(245,235,221,.62); --crema-linea:rgba(245,235,221,.14);
  --naranja:#FF8A1F; --bombilla:#FFD23F;
  --ok:#52D69B; --ko:#FF6B6B;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
html{background:var(--noche)}
body{background:var(--noche);color:var(--crema);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  background-image:radial-gradient(circle at 50% -10%,rgba(255,210,63,.13),transparent 55%)}
#app{max-width:520px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--bombilla);outline-offset:3px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--crema-tenue);font-weight:800}

/* Portada */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:12px}
.hero h1{font-size:clamp(44px,12vw,64px);font-weight:800;letter-spacing:-.01em}
.hero h1 span{color:var(--bombilla)}
.hero p{color:var(--crema-tenue);max-width:34ch}
.big-bulb{width:92px;height:92px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--noche-2);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:26px;color:var(--bombilla);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--crema-tenue)}
.menu{display:flex;flex-direction:column;gap:10px}
.btn{border-radius:16px;padding:16px 18px;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn small{display:block;font-weight:600;font-size:13px;opacity:.75}
.btn-main{background:var(--naranja);color:var(--noche)}
.btn-alt{background:var(--noche-2);border:1px solid var(--crema-linea)}
.btn-alt .tag{background:var(--bombilla);color:var(--noche);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.rules{background:var(--noche-2);border-radius:16px;padding:16px 18px;display:grid;gap:10px;font-size:14.5px}
.rules h3{font-size:19px}
.rules li{margin-left:-6px}
.rules ul{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--crema-tenue)}
.rules b{color:var(--crema)}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fuses{display:flex;gap:6px}
.fuse{width:30px;height:16px;border-radius:5px;border:2px solid var(--bombilla);position:relative;background:rgba(255,210,63,.18)}
.fuse::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;background:var(--bombilla);transform:translateY(-50%)}
.fuse.off{border-color:var(--crema-linea);background:transparent}
.fuse.off::after{background:var(--crema-linea);transform:translateY(-50%) rotate(-25deg)}
.score{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;color:var(--bombilla)}
.streak{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--crema-tenue)}
.streak svg{width:30px;height:30px}
.progress{height:6px;background:var(--noche-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--naranja);border-radius:99px;transition:width .3s}

/* Pregunta */
.card{background:var(--crema);color:var(--noche);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.card .type{align-self:flex-start;background:var(--noche);color:var(--bombilla);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.card h2{font-size:clamp(23px,6vw,28px);font-weight:800}
.card .topic{font-size:13px;font-weight:700;color:#6B5E4E}

.bet{display:flex;flex-direction:column;gap:8px}
.bet-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--noche-2);border:2px solid var(--crema-linea);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.chip .bolts{display:flex;gap:1px;height:18px}
.chip .bolts svg{width:12px;height:18px;fill:var(--crema-tenue)}
.chip b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.chip small{font-size:11.5px;color:var(--crema-tenue)}
.chip[aria-pressed="true"]{border-color:var(--bombilla);background:rgba(255,210,63,.12)}
.chip[aria-pressed="true"] .bolts svg{fill:var(--bombilla)}
.chip.risk small{color:var(--ko)}

.answers{display:grid;gap:10px}
.answers.two{grid-template-columns:1fr 1fr}
.ans{background:var(--noche-3);border:2px solid transparent;border-radius:16px;padding:16px;font-weight:800;font-size:17px;text-align:left;min-height:58px;transition:transform .1s,background .2s}
.answers.two .ans{text-align:center;font-family:var(--display);font-size:22px}
.ans:hover{background:#2B3570}
.ans.ok{background:var(--ok);color:var(--noche)}
.ans.ko{background:var(--ko);color:var(--noche)}
.ans.dim{opacity:.35}
.ans:disabled{cursor:default}

/* Revelación */
.reveal{border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--crema-linea);background:var(--noche-2);animation:up .35s ease-out}
.reveal.good{border-color:var(--ok)}
.reveal.bad{border-color:var(--ko)}
.reveal .verdict{font-family:var(--display);font-size:24px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.reveal.good .verdict{color:var(--ok)}
.reveal.bad .verdict{color:var(--ko)}
.reveal .pts{font-size:18px;font-variant-numeric:tabular-nums}
.reveal .src{font-size:12.5px;color:var(--crema-tenue)}
.reveal .unlock{font-size:13px;font-weight:800;color:var(--bombilla)}
.eureka-flash{font-family:var(--display);font-size:15px;color:var(--noche);background:var(--bombilla);border-radius:10px;padding:6px 10px;align-self:flex-start}
@keyframes up{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}

/* Final */
.end{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.end h2{font-size:40px}
.end .final{font-family:var(--display);font-size:64px;color:var(--bombilla);line-height:1;font-variant-numeric:tabular-nums}
.grid-share{font-size:26px;letter-spacing:4px;line-height:1.2}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.row .btn{flex:1 1 200px;justify-content:center}
.note{font-size:13px;color:var(--crema-tenue)}

/* Álbum */
.album-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.album-head h2{font-size:30px}
.back{font-weight:800;color:var(--crema-tenue);padding:6px 0}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.acard{border-radius:16px;padding:14px;min-height:130px;display:flex;flex-direction:column;gap:6px;background:var(--crema);color:var(--noche)}
.acard h4{margin:0;font-family:var(--display);font-size:16px;line-height:1.15}
.acard p{font-size:12.5px;line-height:1.35;color:#3d3a52}
.acard .n{font-size:11px;font-weight:800;color:#8a7a64;letter-spacing:.06em}
.acard.locked{background:var(--noche-2);color:var(--crema-tenue);border:2px dashed var(--crema-linea);align-items:center;justify-content:center;text-align:center}
.acard.locked .n{color:var(--crema-tenue)}
.acard.locked svg{width:34px;height:34px;opacity:.35}
.lang-row{display:flex;justify-content:flex-end}
.lang{font-weight:800;font-size:13px;color:var(--crema);border:1px solid var(--crema-linea);border-radius:999px;padding:6px 14px;background:var(--noche-2)}
/* Imagen de la pregunta */
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pic{font-size:54px;line-height:1;width:84px;height:84px;flex:none;display:grid;place-items:center;border-radius:22px;background:var(--noche);box-shadow:inset 0 0 0 3px var(--bombilla);margin-top:-4px}
.acard .pic-s{font-size:30px;line-height:1}

/* Duelo */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--crema-tenue)}
.field input{font:inherit;font-weight:800;font-size:17px;background:var(--noche-2);color:var(--crema);border:2px solid var(--crema-linea);border-radius:14px;padding:12px 14px;min-width:0}
.field input:focus{outline:none;border-color:var(--bombilla)}
.join-row{display:flex;gap:8px}
.join-row input{flex:1;text-transform:uppercase;letter-spacing:.2em}
.join-row .btn{flex:none}
.panel{background:var(--noche-2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-size:20px}
.code{font-family:var(--display);font-size:52px;letter-spacing:.18em;color:var(--bombilla);text-align:center;line-height:1}
.peers{display:flex;flex-direction:column;gap:6px}
.peer{display:flex;justify-content:space-between;background:var(--noche-3);border-radius:12px;padding:10px 12px;font-weight:800}
.peer small{color:var(--crema-tenue);font-weight:600}
.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.side{background:var(--noche-2);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;min-width:0}
.side.right{text-align:right}
.side .who{font-size:13px;font-weight:800;color:var(--crema-tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .pts{font-family:var(--display);font-size:28px;color:var(--bombilla);font-variant-numeric:tabular-nums;line-height:1.1}
.side .st{font-size:12px;color:var(--crema-tenue);min-height:16px}
.side.done .st{color:var(--ok)}
.vs{font-family:var(--display);font-size:18px;color:var(--naranja)}
.timer{height:8px;background:var(--noche-2);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--bombilla);border-radius:99px;transition:width .2s linear}
.timer.low i{background:var(--ko)}
.duel-res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duel-res div{background:var(--noche-3);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.duel-res b{font-size:13px;color:var(--crema-tenue)}
.duel-res span{font-weight:800}
.duel-res .p{font-family:var(--display);font-size:20px}
.duel-res .p.plus{color:var(--ok)} .duel-res .p.minus{color:var(--ko)}
.spark{color:var(--bombilla);font-size:12px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

}

 {id:19,e:'🥱',t:'vf',tema:'Animales',q:'Los perros se contagian más del bostezo de su dueño que del de un desconocido.',a:0,titulo:'Bostezos contagiosos',dato:'Entre la mitad y dos tercios de los adultos se contagian. Y los perros, más de quien conocen.',src:'Live Science, Medical News Today y Phys.org'},
 {id:20,e:'💧',t:'op',tema:'Tu cuerpo',q:'¿Por qué se arrugan los dedos en el agua?',opts:['La piel se empapa','Lo provoca tu sistema nervioso','Se te enfrían las manos'],a:1,titulo:'Dedos arrugados',dato:'Es una respuesta del sistema nervioso, y ayuda a agarrar cosas mojadas. Neumáticos de lluvia en tus manos.',src:'Smithsonian y California Academy of Sciences'},
 {id:21,e:'⛪',t:'num',tema:'Barcelona',q:'La Sagrada Família, con la cruz de la torre de Jesús, ¿mide más o menos de 170 metros?',a:0,titulo:'La iglesia más alta',dato:'Mide 172,5 m desde febrero de 2026 y supera a la catedral de Ulm, en el centenario de la muerte de Gaudí.',src:'¡HOLA!, Vatican News y Forbes'},
 {id:22,e:'⚔️',t:'vf',tema:'Mitos',q:'Los vikingos llevaban cascos con cuernos.',a:1,titulo:'Cuernos vikingos',dato:'No se ha encontrado ni uno. Se los pusieron en 1876, en una ópera de Wagner.',src:'History Hit y Mental Floss'},
 {id:23,e:'📏',t:'vf',tema:'Mitos',q:'Napoleón era muy bajito para su época.',a:1,titulo:'Napoleón',dato:'Medía casi 1,70, lo normal entonces. El mito viene de confundir pulgadas francesas e inglesas, y de los caricaturistas británicos.',src:'Today I Found Out y English Plus Podcast'},
 {id:24,e:'🐙',t:'op',tema:'Animales',q:'¿Cuántos corazones tiene un pulpo?',opts:['Uno','Dos','Tres'],a:2,titulo:'Tres corazones',dato:'Dos para las branquias y uno para el cuerpo. Y su sangre es azul porque usa cobre en vez de hierro.',src:'BBC Science Focus y ScienceABC'},
 {id:25,e:'🦇',t:'vf',tema:'Animales',q:'Los murciélagos son ciegos.',a:1,titulo:'Murciélagos',dato:'Ninguno es ciego. Muchos cazan con el eco de sus sonidos, pero también ven, y algunos muy bien.',src:'Reconnect With Nature y FactMyth'},
 {id:26,e:'👶',t:'num',tema:'Tu cuerpo',q:'Un bebé al nacer tiene… ¿más o menos de 250 huesos?',a:0,titulo:'Huesos de bebé',dato:'Unos 300. De adulto tienes 206: no se pierden, se van uniendo.',src:'Healthline y Popular Science'},
 {id:27,e:'🔔',t:'op',tema:'Viajes',q:'¿Qué es exactamente el Big Ben?',opts:['La torre del reloj','La campana','El reloj'],a:1,titulo:'El Big Ben',dato:'Es la campana. La torre se llama Torre Isabel desde 2012.',src:'History.com y GeekDad'},
 {id:28,e:'🦓',t:'op',tema:'Animales',q:'Según un experimento de 2019, ¿para qué sirven las rayas de las cebras?',opts:['Para despistar a los leones','Para que las moscas no consigan aterrizar','Para refrescarse'],a:1,titulo:'Las rayas de la cebra',dato:'Vistieron caballos de cebra y las moscas no lograban posarse.',src:'University of Bristol y Axios'},
 {id:29,e:'⏱️',t:'num',tema:'Historia',q:'La guerra más corta de la historia duró… ¿más o menos de una hora?',a:1,titulo:'La guerra más corta',dato:'Unos 38 minutos, entre Reino Unido y Zanzíbar. Y al perdedor le tocó pagar los proyectiles.',src:'Wikipedia y History Hit'},
 {id:30,e:'🕵️',t:'vf',tema:'Barcelona',q:'Un espía de Barcelona convenció a Hitler de que el desembarco sería en Calais.',a:0,titulo:'Garbo',dato:'Joan Pujol se inventó una red entera de espías falsos. Lo condecoraron los dos bandos.',src:'English Heritage y BBC Mundo'},
 {id:31,e:'🧮',t:'vf',tema:'Mitos',q:'Einstein suspendió matemáticas en el colegio.',a:1,titulo:'Einstein',dato:'Él mismo lo desmintió en 1935. El bulo pudo salir de una escala de notas que se invirtió en su escuela suiza.',src:'TIME y History.com'},
 {id:32,e:'🍯',t:'vf',tema:'Comida',q:'La miel no caduca.',a:0,titulo:'La miel',dato:'En tumbas egipcias se ha encontrado miel de hace miles de años. Poca agua, mucho ácido y un truco de las abejas.',src:'Smithsonian Magazine y Discover Magazine'},
 {id:33,e:'❄️',t:'vf',tema:'Tu cuerpo',q:'El músculo que te pone la piel de gallina está conectado con las células que fabrican pelo nuevo.',a:0,titulo:'Piel de gallina',dato:'Bajo cada pelo hay un músculo diminuto. En 2020, investigadores de Harvard vieron en ratones que ese músculo y su nervio están conectados a las células que fabrican pelo.',src:'Neuroscience News y Salon'},
 {id:34,e:'🌅',t:'op',tema:'Ciencia',q:'El aire desvía la luz violeta aún más que la azul. Entonces, ¿por qué el cielo es azul y no violeta?',opts:['Llega menos violeta del sol y tus ojos son más sensibles al azul','El mar refleja su color en el cielo','El violeta se queda en la capa de ozono'],a:0,titulo:'El cielo azul',dato:'El aire desvía mucho más la luz azul que la roja. Y al atardecer, el azul se pierde por el camino: por eso se ve naranja.',src:'Met Office y Royal Museums Greenwich'},
 {id:35,e:'✨',t:'op',tema:'Tu cuerpo',q:'¿Por qué ves estrellitas al levantarte rápido?',opts:['La sangre baja a las piernas y al cerebro le llega menos un momento','Te sube la tensión de golpe','Se te cansan los ojos'],a:0,titulo:'Estrellitas',dato:'Normalmente tu cuerpo lo arregla en segundos. Si te pasa a menudo o llegas a desmayarte, coméntaselo a tu médico.',src:'Manual MSD y Clínica Universidad de Navarra'},
 {id:36,e:'🐟',t:'vf',tema:'Animales',q:'Los peces tienen memoria de tres segundos.',a:1,titulo:'La memoria del pez',dato:'Unos peces que aprendieron a asociar un sonido con la comida seguían acudiendo meses después, ya en el mar.',src:'Practical Fishkeeping y Mental Floss'},
 {id:37,e:'🌊',t:'num',tema:'Viajes',q:'El Mar Muerto tiene… ¿más o menos de 5 veces la sal del mar normal?',a:0,titulo:'El Mar Muerto',dato:'Unas diez veces más. Con tanta sal, el agua te empuja hacia arriba y no te puedes hundir.',src:'How It Works y ScienceABC'},
 {id:38,e:'🐪',t:'vf',tema:'Animales',q:'La joroba del camello es un depósito de agua.',a:1,titulo:'La joroba del camello',dato:'Es grasa, hasta unos 35 kilos. Y cuando encuentra agua, se bebe más de cien litros en un cuarto de hora.',src:'National Geographic y Cleveland Zoo Society'},
 {id:39,e:'🪺',t:'vf',tema:'Animales',q:'El avestruz esconde la cabeza en la arena cuando tiene miedo.',a:1,titulo:'El avestruz',dato:'Si lo hiciera, se ahogaría. Lo que hace es meter la cabeza en el nido para girar los huevos.',src:'National Geographic Kids y McGill OSS'},
 {id:40,e:'🤧',t:'vf',tema:'Tu cuerpo',q:'Hay gente que estornuda al mirar al sol, y se hereda.',a:0,titulo:'Estornudar con el sol',dato:'Se llama reflejo fótico del estornudo. No eres raro: viene de familia.',src:'Live Science y PBS'},
 {id:41,e:'🖐️',t:'op',tema:'Ciencia',q:'Un médico se crujió los dedos de una sola mano durante 60 años. ¿Qué encontró al final?',opts:['Artritis en esa mano','Ninguna diferencia entre las dos manos','Dedos más largos'],a:1,titulo:'Crujirse los dedos',dato:'Comparó las dos manos y no vio diferencias. Le dieron el Ig Nobel por el experimento.',src:'The Tech e Improbable Research'},
 {id:42,e:'🏛️',t:'op',tema:'Viajes',q:'¿Cuándo empezó a inclinarse la Torre de Pisa?',opts:['Antes de acabarla, en el segundo piso','Con un terremoto en 1900','En la Segunda Guerra Mundial'],a:0,titulo:'La Torre de Pisa',dato:'Se torcía mientras la construían. Las guerras, al parar las obras, dieron tiempo al terreno a asentarse y la salvaron.',src:'Wikipedia y Mental Floss'},
 {id:43,e:'🦎',t:'op',tema:'Barcelona',q:'¿Qué iba a ser el Park Güell?',opts:['Un zoológico','Una urbanización de lujo','Un cementerio'],a:1,titulo:'El Park Güell',dato:'Había 60 parcelas previstas y solo se vendieron dos. En una de las casas vivió el propio Gaudí.',src:'My Modern Met y Barcelona-Tickets'},
 {id:44,e:'🌳',t:'vf',tema:'Barcelona',q:'La Rambla de Barcelona era un cauce por donde bajaba el agua.',a:0,titulo:'La Rambla',dato:'Era una riera que bajaba de Collserola junto a la muralla. Hasta el nombre viene del árabe: arenal.',src:'Amics de la Rambla y Barcelona Urbana'},
 {id:45,e:'🍭',t:'op',tema:'España',q:'¿Quién dibujó el logo de Chupa Chups?',opts:['Joan Miró','Salvador Dalí','Pablo Picasso'],a:1,titulo:'El logo de Chupa Chups',dato:'Dalí lo dibujó en menos de una hora en 1969. Y le aconsejó ponerlo arriba del envoltorio, y no en los lados.',src:'Wikipedia y Tasting Table'},
 {id:46,e:'🧽',t:'vf',tema:'España',q:'La fregona es un invento español.',a:0,titulo:'La fregona',dato:'Manuel Jalón vio en Estados Unidos cómo limpiaban los hangares de aviones y en 1956 la llevó a las casas.',src:'Público y Telefónica'},
 {id:47,e:'⚓',t:'op',tema:'España',q:'¿Qué botó Isaac Peral en 1888?',opts:['Un submarino eléctrico que lanzaba torpedos','El primer barco de vapor','Un hidroavión'],a:0,titulo:'El submarino de Peral',dato:'Funcionaba bajo el agua y lanzaba torpedos. Aun así, lo abandonaron.',src:'Biografías y Vidas y FECYT'},
 {id:48,e:'🌙',t:'vf',tema:'Historia',q:'Cleopatra vivió más cerca de la llegada a la Luna que de la construcción de la Gran Pirámide.',a:0,titulo:'Cleopatra',dato:'Cuando ella nació, la Gran Pirámide ya tenía unos 2.500 años.',src:'WorldAtlas y Lenz'},
 {id:49,e:'🎓',t:'vf',tema:'Historia',q:'La Universidad de Oxford es más antigua que la ciudad azteca de Tenochtitlán.',a:0,titulo:'Oxford y los aztecas',dato:'En Oxford ya se daban clases hacia 1096. Tenochtitlán se fundó en 1325.',src:'Smithsonian Magazine y FactMyth'},
 {id:50,e:'🌄',t:'num',tema:'Tu cuerpo',q:'Por la mañana eres más alto que por la noche. ¿La diferencia es de más o menos de 5 cm?',a:1,titulo:'Más alto por la mañana',dato:'Alrededor de un centímetro. Los discos de la columna se aplastan durante el día y se recuperan por la noche.',src:'Jamaica Hospital Medical Center e Indiana Public Media'},
 {id:51,e:'💬',t:'op',tema:'Tecnología',q:'¿Qué decía el primer SMS de la historia, en 1992?',opts:['Hello world','Merry Christmas','Happy new year'],a:1,titulo:'El primer SMS',dato:'Dos palabras: Merry Christmas. Y quien lo recibió no pudo contestar, porque su móvil no enviaba mensajes.',src:'Wikipedia y History.com'},
 {id:52,e:'🍌',t:'vf',tema:'Comida',q:'Los plátanos son un poquito radiactivos.',a:0,titulo:'Plátanos radiactivos',dato:'Por su potasio. Tan poco que se usa en broma como unidad de medida. Y tú también lo eres.',src:'Wikipedia y Today I Found Out'},
 {id:53,e:'🍓',t:'vf',tema:'Comida',q:'Para la botánica, la fresa es una baya y el plátano no.',a:1,titulo:'La fresa y el plátano',dato:'Es al revés: el plátano es una baya y la fresa no. Los puntitos de la fresa son, cada uno, un fruto.',src:'Science Notes y ZME Science'},
 {id:54,e:'🧊',t:'op',tema:'Geografía',q:'¿Cuál es el desierto más grande del mundo?',opts:['El Sáhara','La Antártida','El Gobi'],a:1,titulo:'El desierto helado',dato:'Un desierto es un sitio donde casi no llueve, no donde hay arena. Y en la Antártida casi no cae nada.',src:'Britannica y WorldAtlas'},
 {id:55,e:'🦈',t:'vf',tema:'Animales',q:'Los tiburones existen desde antes que los árboles.',a:0,titulo:'Tiburones antiguos',dato:'Cuando aparecieron, en tierra solo había musgos. Y han sobrevivido a cinco extinciones masivas.',src:'Discover Wildlife y EarthDate'}

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296}}
function shuffle(a,r=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function optsOf(q){return q.t==='vf'?S.vf:q.t==='num'?S.num:q.opts}

function cardHTML(q,meta){
  return `<article class="card">
    <div class="card-top"><span class="type">${TIPO[q.t]}</span><div class="pic" aria-hidden="true">${q.e}</div></div>
    <h2>${q.q}</h2>
    <span class="topic">${meta}</span>
  </article>`;
}

function start(mode){
  const qs=mode==='diario'?shuffle(Q,rng('eureka'+today())).slice(0,DAILY):shuffle(Q).slice(0,ROUND);
  G={mode,qs,i:0,fuses:FUSES,score:0,streak:0,bet:1,grid:[],done:false,newCards:0};
  question();
}

function hud(){
  const lvl=Math.min(G.streak,3);
  const fus=Array.from({length:FUSES},(_,k)=>`<span class="fuse ${k<G.fuses?'':'off'}" title="${S.fuse}"></span>`).join('');
  return `<div class="hud">
    <div class="fuses" aria-label="${S.fuses(G.fuses)}">${fus}</div>
    <div class="score" aria-label="${S.points}">${G.score}</div>
    <div class="streak">${G.streak>=3?'x2':S.streak(G.streak)}${bulb(lvl)}</div>
  </div>
  <div class="progress" aria-hidden="true"><i style="width:${(G.i/G.qs.length)*100}%"></i></div>`;
}

function question(){
  const q=G.qs[G.i];
  const opts=optsOf(q);
  const two=q.t!=='op';
  app.innerHTML=hud()+`
  ${cardHTML(q,S.qOf(q.tema,G.i+1,G.qs.length))}
  <div class="bet">
    <span class="eyebrow">${S.yourVolt}</span>
    <div class="bet-row">${BETS.map(b=>`<button class="chip ${b.fus>1?'risk':''}" aria-pressed="${G.bet===b.v}" data-bet="${b.v}">
      <span class="bolts">${BOLT.repeat(b.v)}</span><b>+${b.pts*(G.streak>=3?2:1)}</b><small>${S.risk(b.fus)}</small></button>`).join('')}</div>
  </div>
  <div class="answers ${two?'two':''}">${opts.map((o,k)=>`<button class="ans" data-k="${k}">${o}</button>`).join('')}</div>
  <div id="reveal-slot"></div>`;
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{G.bet=+c.dataset.bet;app.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c))});
  app.querySelectorAll('.ans').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}

function answer(k){
  const q=G.qs[G.i], b=BETS[G.bet-1], right=k===q.a;
  app.querySelectorAll('.chip').forEach(c=>c.disabled=true);
  app.querySelectorAll('.ans').forEach(el=>{const j=+el.dataset.k;el.disabled=true;if(j===q.a)el.classList.add('ok');else if(j===k)el.classList.add('ko');else el.classList.add('dim')});
  let pts=0,flash='',unlock='';
  if(right){
    G.streak++;
    const mult=G.streak>3?2:1; // la racha de 3 enciende la bombilla para las siguientes
    pts=b.pts*mult; G.score+=pts;
    if(G.streak===3) flash=`<span class="eureka-flash">${S.eureka}</span>`;
    if(!store.album.includes(q.id)){store.album.push(q.id);G.newCards++;unlock=`<span class="unlock">${S.newCard}</span>`}
  } else {
    G.streak=0; G.fuses=Math.max(0,G.fuses-b.fus);
  }
  G.grid.push(right?(G.bet===3?'🟨':'🟩'):'⬛');
  save();
  const last=G.i===G.qs.length-1||G.fuses===0;
  document.getElementById('reveal-slot').outerHTML=`
  <section class="reveal ${right?'good':'bad'}">
    <div class="verdict"><span>${right?S.right:S.wrong}</span><span class="pts">${right?'+'+pts:S.lost(b.fus)}</span></div>
    ${flash}
    <p>${q.dato}</p>
    <p class="src">${S.sources}${q.src}</p>
    ${unlock}
    <button class="btn btn-main" id="b-next" style="justify-content:center">${last?(G.fuses===0?S.blown:S.seeRes):S.next}</button>
  </section>`;
  // la cabecera refleja fusibles y puntos al instante
  const h=app.querySelector('.hud'), p=app.querySelector('.progress');
  const tmp=document.createElement('div');G.i++;tmp.innerHTML=hud();G.i--;
  h.replaceWith(tmp.children[0]); p.replaceWith(tmp.children[0]);
  const nb=document.getElementById('b-next'); nb.focus({preventScroll:true}); nb.scrollIntoView({behavior:'smooth',block:'nearest'});
  nb.onclick=()=>{ if(last) finish(); else {G.i++;question();window.scrollTo({top:0})} };
}

function finish(){
  const bonus=G.fuses*30; G.score+=bonus;
  store.games++; if(G.score>store.best) store.best=G.score;
  const res={date:today(),mode:G.mode,score:G.score,grid:G.grid.join(''),fuses:G.fuses,bonus,cards:G.newCards,total:G.qs.length};
  if(G.mode==='diario') store.daily=res;
  save(); end(res,false);
}

function end(r,again){
  const dd=r.mode==='diario'?r.date.split('-').reverse().slice(0,2).join('/'):'';
  const url=/^https?:/.test(location.href)&&!IN_CLAUDE?'\n'+location.href.split('#')[0]+(LANG==='en'?'#en':''):'';
  const share=`${S.shareHead(dd)}\n${r.grid}\n${S.sharePts(r.score,r.fuses)}${url}`;
  app.innerHTML=`
  <section class="end">
    <div class="big-bulb" style="width:80px;height:80px">${bulb(r.fuses>0?3:0)}</div>
    <h2>${r.fuses>0?S.lit:S.dark}</h2>
    <div class="final">${r.score}</div>
    <p class="note">${r.bonus?S.bonus(r.bonus,r.fuses):''}${r.cards?S.cards(r.cards):''}${again?S.again:''}</p>
    <div class="grid-share" aria-label="${S.summary}">${r.grid}</div>
    <p class="note">${S.legend}</p>
    <div class="row">
      <button class="btn btn-main" id="b-copy">${S.copy}</button>
      <button class="btn btn-alt" id="b-home" style="justify-content:center">${S.home}</button>
    </div>
    <p class="note" id="copied" hidden>${S.copied}</p>
  </section>`;
  document.getElementById('b-home').onclick=home;
  document.getElementById('b-copy').onclick=()=>{
    const ok=()=>{document.getElementById('copied').hidden=false};
    try{navigator.clipboard.writeText(share).then(ok,()=>fallback(share,ok))}catch(e){fallback(share,ok)}
  };
}
function fallback(t,ok){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}ta.remove()}

function album(){
  app.innerHTML=`
  <div class="album-head"><h2>${S.yourAlbum}</h2><button class="back" id="b-back">${S.back}</button></div>
  <p class="note">${S.albumNote(store.album.length,Q.length)}</p>

    ?`<div class="acard"><span class="pic-s" aria-hidden="true">${q.e}</span><span class="n">${S.no} ${String(q.id).padStart(2,'0')} · ${q.tema}</span><h4>${q.titulo}</h4><p>${q.dato}</p></div>`
    :`<div class="acard locked"><span class="n">${S.no} ${String(q.id).padStart(2,'0')}</span>${bulb(0)}<span class="note">${q.tema}</span></div>`).join('')}</div>`;
  document.getElementById('b-back').onclick=home;
}

const DUEL_N=10, DUEL_T=20000, GRACE=1500, CHISPA=15;
let D=null, ROOM=null, ROOMAPI=null, unsubPeers=null, tickId=null, botId=null, advId=null;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nOpts(q){return q.t==='op'?3:2}
function clearTimers(){clearInterval(tickId);clearTimeout(botId);clearTimeout(advId);tickId=botId=advId=null}
function leaveRoom(){clearTimers();if(unsubPeers){try{unsubPeers()}catch(e){}unsubPeers=null}if(ROOM){ROOM.leave().catch(()=>{});ROOM=null}D=null}

/* Puntos de una respuesta: acierto suma lo apostado (+ chispa si fue el primero en acertar), fallo lo resta */
function qPoints(q,a,other){
  if(!a) return {pts:0,spark:false};
  const b=BETS[a.b-1];
  if(a.k!==q.a) return {pts:-b.pts,spark:false};
  const beaten=other&&other.k===q.a&&other.ms<a.ms;
  return {pts:b.pts+(beaten?0:CHISPA),spark:!beaten};
}
function totals(upto){
  let me=0,op=0;
  for(let i=0;i<=upto&&i<D.qs.length;i++){const q=D.qs[i];me+=qPoints(q,D.me.ans[i],D.opp.ans[i]).pts;op+=qPoints(q,D.opp.ans[i],D.me.ans[i]).pts}
  return {me,op};
}

function duelMenu(){
  leaveRoom(); G=null;
  app.innerHTML=`
  <div class="album-head"><h2>${S.duelT}</h2><button class="back" id="b-back">${S.back}</button></div>
  <p class="note">${S.duelNote(DUEL_N,CHISPA)}</p>
  <div class="field"><label for="nick">${S.yourName}</label><input id="nick" maxlength="16" placeholder="${S.namePh}" value="${esc(store.nick||'')}"></div>
  <button class="btn btn-main" id="b-bot"><span>${S.vsBot}<small>${S.vsBotSub}</small></span></button>
  <div class="panel">
    <h3>${S.vsFriend}</h3>
    <button class="btn btn-alt" id="b-create" style="justify-content:center">${S.create}</button>
    <div class="join-row"><div class="field" style="flex:1"><label for="code">${S.orCode}</label><input id="code" maxlength="4" placeholder="ABCD" autocomplete="off"></div><button class="btn btn-alt" id="b-join" style="align-self:flex-end">${S.join}</button></div>
    <p class="note" id="online-msg">${IN_CLAUDE?S.friendClaude:S.friendWeb}</p>
  </div>`;
  const saveNick=()=>{store.nick=(document.getElementById('nick').value||'').trim().slice(0,16);save()};
  document.getElementById('b-back').onclick=home;
  document.getElementById('b-bot').onclick=()=>{saveNick();startBot()};
  document.getElementById('b-create').onclick=()=>{saveNick();enterRoom(randomCode(),true)};
  document.getElementById('b-join').onclick=()=>{saveNick();const c=(document.getElementById('code').value||'').trim().toUpperCase();if(!/^[A-Z0-9]{4}$/.test(c)){onlineMsg(S.badCode);return}enterRoom(c,false)};
}
function onlineMsg(t){const m=document.getElementById('online-msg');if(m)m.textContent=t}
function randomCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
function myNick(){return store.nick||S.you}

/* Contra la máquina */
function startBot(){
  clearTimers();
  D={mode:'bot',qs:shuffle(Q).slice(0,DUEL_N),qi:-1,me:{nick:myNick(),ans:{}},opp:{nick:'Edison',ans:{}},phase:'q',revealed:-1};
  goQuestion(0);
}
function scheduleBot(){
  const q=D.qs[D.qi], qi=D.qi, right=Math.random()<0.7;
  let k=q.a; if(!right){const others=[...Array(nOpts(q)).keys()].filter(x=>x!==q.a);k=others[Math.floor(Math.random()*others.length)]}
  const b=right?(Math.random()<.6?3:2):(Math.random()<.6?1:2);
  const ms=3000+Math.random()*6000;
  botId=setTimeout(()=>{if(!D||D.qi!==qi||D.phase!=='q')return;D.opp.ans[qi]={k,b,ms};updateVersus();checkReveal()},ms);
}

/* Online, con salas de la página */
async function getRoomApi(){
  if(ROOMAPI) return ROOMAPI;
  if(!window.claude||typeof window.claude.use!=='function') return null;
  try{ROOMAPI=await window.claude.use('room')}catch(e){ROOMAPI=null}
  return ROOMAPI;
}
/* Fuera de Claude (web pública): duelo directo entre los dos navegadores con PeerJS */
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==='function');
function loadPeerJS(){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src=window.PEERJS_SRC||'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=res;s.onerror=()=>rej(new Error('peerjs'));document.head.appendChild(s)})}
async function peerRoom(code,host){
  await loadPeerJS();
  const id='eureka-voltaje-'+code.toLowerCase();
  const me={presence:{},sameTab:true,isMe:true,kind:'viewer'};
  let other=null,conn=null,handlers=[];
  const peer=host?new Peer(id):new Peer();
  const snapshot=()=>({peers:[me].concat(other?[other]:[])});
  const fire=()=>{const s=snapshot();handlers.forEach(h=>{try{h(s)}catch(e){}})};
  const send=()=>{if(conn&&conn.open){try{conn.send({p:me.presence})}catch(e){}}};
  const wire=c=>{conn=c;
    c.on('open',()=>{other={presence:{},sameTab:false,isMe:false,kind:'viewer'};send();fire()});
    c.on('data',d=>{if(d&&d.p&&typeof d.p==='object'){other={presence:d.p,sameTab:false,isMe:false,kind:'viewer'};fire()}});
    c.on('close',()=>{if(conn===c){other=null;conn=null;fire()}});};
  await new Promise((res,rej)=>{const t=setTimeout(()=>rej({type:'timeout'}),10000);peer.on('open',()=>{clearTimeout(t);res()});peer.on('error',e=>{clearTimeout(t);rej(e)})});
  if(host){peer.on('connection',c=>{if(conn&&conn.open){c.close();return}wire(c)})}
  else{
    await new Promise((res,rej)=>{const t=setTimeout(()=>rej({type:'peer-unavailable'}),10000);const c=peer.connect(id,{reliable:true});wire(c);c.on('open',()=>{clearTimeout(t);res()});peer.on('error',e=>{clearTimeout(t);rej(e)})});
  }
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  return{
    presence(patch){const n=Object.assign({},me.presence);for(const k in patch){if(patch[k]===null)delete n[k];else n[k]=patch[k]}me.presence=n;send();fire();return Promise.resolve()},
    onPeers(fn){handlers.push(fn);setTimeout(()=>fn(snapshot()),0);return()=>{handlers=handlers.filter(h=>h!==fn)}},
    leave(){try{peer.destroy()}catch(e){}return Promise.resolve()}
  };
}
async function enterRoom(code,host){
  onlineMsg(S.connecting);
  let r=null;
  if(IN_CLAUDE){
    const api=await getRoomApi();
    if(!api){onlineMsg(S.noRoomClaude);return}
    try{r=await api.join('eureka-'+code.toLowerCase())}catch(e){onlineMsg(S.joinFail);return}
  } else {
    try{r=await peerRoom(code,host)}catch(e){
      const t=e&&e.type;
      if(host&&t==='unavailable-id'){return enterRoom(randomCode(),true)}
      onlineMsg(t==='peer-unavailable'?S.noRoom:S.netFail);return}
  }
  ROOM=r;
  D={mode:'online',code,host,seed:null,qs:null,qi:-1,me:{nick:myNick(),ans:{}},opp:{nick:S.rival,ans:{},here:false},phase:'lobby',revealed:-1,oppRaw:null};
  ROOM.presence({nick:D.me.nick,host:!!host,ans:{seed:null,a:{}},game:null}).catch(()=>{});
  unsubPeers=ROOM.onPeers(onRoomPeers,()=>{if(D&&D.phase==='lobby')lobby(S.lostConn)});
  lobby();
}
function cleanAns(x,seed){
  const out={}; if(!x||x.seed!==seed||!x.a||typeof x.a!=='object') return out;
  for(const key of Object.keys(x.a)){const i=+key,v=x.a[key];
    if(Number.isInteger(i)&&i>=0&&i<DUEL_N&&v&&Number.isInteger(v.k)&&v.k>=0&&v.k<3&&[1,2,3].includes(v.b)&&typeof v.ms==='number'&&isFinite(v.ms)) out[i]={k:v.k,b:v.b,ms:Math.min(Math.max(0,v.ms),DUEL_T)}}
  return out;
}
function onRoomPeers(change){
  if(!D||D.mode!=='online') return;
  const others=change.peers.filter(p=>!p.sameTab&&p.kind==='viewer');
  const opp=others[0]||null;
  D.opp.here=!!opp;
  D.opp.nick=opp&&opp.presence&&opp.presence.nick?String(opp.presence.nick).slice(0,16):S.rival;
  D.oppRaw=opp?opp.presence.ans:null;
  if(!D.host){
    const hp=others.find(p=>p.presence&&p.presence.host);
    const g=hp&&hp.presence.game;
    if(g&&typeof g.seed==='string'&&Number.isInteger(g.qi)){
      if(g.seed!==D.seed) newGame(g.seed,false);
      if(g.qi>D.qi){ if(g.qi>=DUEL_N){D.opp.ans=cleanAns(D.oppRaw,D.seed);duelEnd();return} goQuestion(g.qi); }
    }
  }
  if(D.seed) D.opp.ans=cleanAns(D.oppRaw,D.seed);
  if(D.phase==='lobby') lobby();
  else if(D.phase==='q'){updateVersus();checkReveal()}
  else if(D.phase==='r'){updateVersus()}
}
function newGame(seed,announce){
  clearTimers();
  D.seed=seed; D.qs=shuffle(Q,rng(seed)).slice(0,DUEL_N); D.qi=-1; D.revealed=-1; D.me.ans={}; D.opp.ans={};
  const patch={ans:{seed,a:{}}}; if(announce) patch.game={seed,qi:0};
  ROOM&&ROOM.presence(patch).catch(()=>{});
}
function lobby(err){
  D.phase='lobby';
  app.innerHTML=`
  <div class="album-head"><h2>${S.room}</h2><button class="back" id="b-back">${S.exit}</button></div>
  <div class="panel">
    <span class="eyebrow" style="text-align:center">${S.roomCode}</span>
    <div class="code">${esc(D.code)}</div>
    <p class="note" style="text-align:center">${D.host?S.hostNote:S.guestNote}</p>
  </div>
  <div class="peers">
    <div class="peer"><span>${esc(D.me.nick)}</span><small>${S.youTag(D.host)}</small></div>
    ${D.opp.here?`<div class="peer"><span>${esc(D.opp.nick)}</span><small>${D.host?S.ready:S.created}</small></div>`:`<div class="peer"><span style="color:var(--crema-tenue)">${S.waiting}</span><small></small></div>`}
  </div>
  ${err?`<p class="note" style="color:var(--ko)">${esc(err)}</p>`:''}
  ${D.host?`<button class="btn btn-main" id="b-start" style="justify-content:center" ${D.opp.here?'':'disabled'}>${D.opp.here?S.start:S.missing}</button>`:''}`;
  document.getElementById('b-back').onclick=()=>{leaveRoom();duelMenu()};
  const s=document.getElementById('b-start'); if(s) s.onclick=hostStart;
}
function hostStart(){ if(!D||!D.host) return; newGame(D.code+'-'+Date.now().toString(36),true); goQuestion(0) }
function hostAdvance(){
  if(!D||!D.host||D.mode!=='online') return;
  const next=D.qi+1;
  ROOM&&ROOM.presence({game:{seed:D.seed,qi:next}}).catch(()=>{});
  if(next>=DUEL_N) duelEnd(); else goQuestion(next);
}

/* Pantallas comunes del duelo */
function versusHTML(){
  const t=totals(D.revealed);
  const st=(a)=>D.phase==='q'?(a?S.answered:S.thinking):'';
  const meA=D.me.ans[D.qi], opA=D.opp.ans[D.qi];
  return `<div class="versus">
    <div class="side ${D.phase==='q'&&meA?'done':''}"><span class="who">${esc(D.me.nick)}</span><span class="pts">${t.me}</span><span class="st">${st(meA)}</span></div>
    <span class="vs">VS</span>
    <div class="side right ${D.phase==='q'&&opA?'done':''}"><span class="who">${esc(D.opp.nick)}</span><span class="pts">${t.op}</span><span class="st">${D.mode==='online'&&!D.opp.here?S.offline:st(opA)}</span></div>
  </div>`;
}
function updateVersus(){const v=app.querySelector('.versus');if(v){const d=document.createElement('div');d.innerHTML=versusHTML();v.replaceWith(d.firstElementChild)}}

function goQuestion(i){
  clearTimers();
  D.qi=i; D.phase='q'; D.t0=Date.now(); D.bet=1;
  const q=D.qs[i], opts=optsOf(q);
  app.innerHTML=versusHTML()+`
  <div class="timer" id="timer"><i style="width:100%"></i></div>
  ${cardHTML(q,S.qOf(q.tema,i+1,DUEL_N))}
  <div class="bet">
    <span class="eyebrow">${S.yourVolt}</span>
    <div class="bet-row">${BETS.map(b=>`<button class="chip" aria-pressed="${b.v===1}" data-bet="${b.v}"><span class="bolts">${BOLT.repeat(b.v)}</span><b>±${b.pts}</b><small>${b.v===1?S.cautious:b.v===2?S.sure:S.allIn}</small></button>`).join('')}</div>
  </div>
  <div class="answers ${q.t!=='op'?'two':''}">${opts.map((o,k)=>`<button class="ans" data-k="${k}">${o}</button>`).join('')}</div>
  <div id="reveal-slot"></div>`;
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{D.bet=+c.dataset.bet;app.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c))});
  app.querySelectorAll('.ans').forEach(b=>b.onclick=()=>myAnswer(+b.dataset.k));
  window.scrollTo({top:0});
  if(D.mode==='bot') scheduleBot();
  tickId=setInterval(tick,200);
  if(D.mode==='online') checkReveal();
}
function lockQuestion(chosen){
  app.querySelectorAll('.chip,.ans').forEach(el=>el.disabled=true);
  if(chosen!=null){const el=app.querySelector(`.ans[data-k="${chosen}"]`);if(el)el.style.borderColor='var(--bombilla)'}
}
function myAnswer(k){
  if(!D||D.phase!=='q'||D.me.ans[D.qi]) return;
  const ms=Math.min(Date.now()-D.t0,DUEL_T);
  D.me.ans[D.qi]={k,b:D.bet,ms};
  lockQuestion(k);
  if(D.mode==='online'&&ROOM) ROOM.presence({ans:{seed:D.seed,a:D.me.ans}}).catch(()=>{});
  updateVersus(); checkReveal();
}
function tick(){
  if(!D||D.phase!=='q') return;
  const el=Date.now()-D.t0, left=Math.max(0,1-el/DUEL_T);
  const t=document.getElementById('timer'); if(t){t.firstElementChild.style.width=(left*100)+'%';t.classList.toggle('low',left<.25)}
  if(el>=DUEL_T&&!D.me.ans[D.qi]&&!D.timedOut){D.timedOut=true;lockQuestion(null)}
  checkReveal();
}
function checkReveal(){
  if(!D||D.phase!=='q') return;
  const el=Date.now()-D.t0, both=D.me.ans[D.qi]&&D.opp.ans[D.qi];
  const limit=D.mode==='online'?DUEL_T+GRACE:DUEL_T;
  if(both||el>=limit||(D.mode==='online'&&!D.opp.here&&D.me.ans[D.qi])) duelReveal();
}
function duelReveal(){
  clearTimers(); D.phase='r'; D.timedOut=false; D.revealed=D.qi;
  const q=D.qs[D.qi], opts=optsOf(q), a=D.me.ans[D.qi], o=D.opp.ans[D.qi];
  const pm=qPoints(q,a,o), po=qPoints(q,o,a);
  app.querySelectorAll('.ans').forEach(el=>{const j=+el.dataset.k;el.disabled=true;if(j===q.a)el.classList.add('ok');else if(a&&j===a.k)el.classList.add('ko');else el.classList.add('dim')});
  app.querySelectorAll('.chip').forEach(c=>c.disabled=true);
  let unlock='';
  if(a&&a.k===q.a&&!store.album.includes(q.id)){store.album.push(q.id);save();unlock=`<span class="unlock">${S.newCard}</span>`}
  const line=(x,p)=>x?`<span>${esc(opts[x.k])} · ${S.bolts(x.b)} · ${(x.ms/1000).toFixed(1)} s</span><span class="p ${p.pts>=0?'plus':'minus'}">${p.pts>0?'+':''}${p.pts}</span>${p.spark?`<span class="spark">${S.spark}</span>`:''}`:`<span>${S.noAns}</span><span class="p">0</span>`;
  const last=D.qi===DUEL_N-1;
  const next=D.mode==='bot'||D.host
    ?`<button class="btn btn-main" id="b-next" style="justify-content:center">${last?S.seeRes:S.next}</button>`
    :`<p class="note" style="text-align:center">${S.nextSoon}</p>`;
  document.getElementById('reveal-slot').outerHTML=`
  <section class="reveal ${a&&a.k===q.a?'good':'bad'}">
    <div class="duel-res"><div><b>${esc(D.me.nick)}</b>${line(a,pm)}</div><div><b>${esc(D.opp.nick)}</b>${line(o,po)}</div></div>
    <p>${q.dato}</p>
    <p class="src">${S.sources}${q.src}</p>
    ${unlock}
    ${next}
  </section>`;
  updateVersus();
  const nb=document.getElementById('b-next');
  if(nb){nb.scrollIntoView({behavior:'smooth',block:'nearest'});nb.onclick=()=>{clearTimeout(advId);D.mode==='bot'?(last?duelEnd():goQuestion(D.qi+1)):hostAdvance()}}
  if(D.mode==='online'&&D.host) advId=setTimeout(hostAdvance,6000);
}
function duelEnd(){
  clearTimers(); D.phase='end'; D.revealed=DUEL_N-1;
  const t=totals(DUEL_N-1), win=t.me>t.op, tie=t.me===t.op;
  if(win){store.wins=(store.wins||0)+1;save()}
  app.innerHTML=`
  <section class="end">
    <div class="big-bulb" style="width:80px;height:80px">${bulb(win||tie?3:0)}</div>
    <h2>${tie?S.tie:win?S.won:S.winner(esc(D.opp.nick))}</h2>
    ${versusHTML()}
    <p class="note">${D.mode==='online'&&!D.host?S.rematchGuest:S.inAlbum}</p>
    <div class="row">
      ${D.mode==='bot'||D.host?`<button class="btn btn-main" id="b-again" style="justify-content:center">${S.rematch}</button>`:''}
      <button class="btn btn-alt" id="b-out" style="justify-content:center">${S.leave}</button>
    </div>
  </section>`;
  const ag=document.getElementById('b-again');
  if(ag) ag.onclick=()=>D.mode==='bot'?startBot():hostStart();
  document.getElementById('b-out').onclick=()=>{leaveRoom();home()};
}

home();
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
